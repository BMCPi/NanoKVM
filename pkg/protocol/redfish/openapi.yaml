openapi: 3.1.0
info:
  title: NanoKVM BMC Redfish API
  version: 1.0.0
  summary: Out-of-band management for the managed host via the Redfish standard.
  description: |
    This is the Redfish (DMTF DSP0266) surface the NanoKVM BMC exposes for
    out-of-band management of the managed host.

    The BMC follows the Redfish Host Interface (DSP0270) model: the host's
    firmware is itself a Redfish client on the USB network link (usb0,
    link-local). Operators stage a boot override and pending BIOS settings
    in BMC state; the host firmware reads them over that link and applies
    them itself at boot. In the other direction the host PUSHES its
    inventory up — identity, boot options, memory, drives, BIOS attributes,
    secure-boot state — and the BMC serves back exactly what was reported.
    The BMC never touches host storage.

    For the full Redfish data-model reference, see
    https://redfish.dmtf.org/schemas/v1/ — every `@odata.type` returned by
    this BMC is a real DMTF schema name.

    ## Authentication

    Public endpoints (no auth):
      - `GET  /redfish`
      - `GET  /redfish/v1` (ServiceRoot)
      - `GET  /redfish/v1/SessionService`
      - `POST /redfish/v1/SessionService/Sessions` (create a session)

    All other endpoints require either:
      - an `X-Auth-Token` header carrying a session token, or
      - the JWT cookie issued by the web UI's `/api/auth/login` flow.

    Requests arriving over the USB host interface are accepted without
    credentials, as DSP0270 permits: network isolation guarantees only the
    managed host can use that link. Writes to host-owned resources
    (BootOptions, Memory, Drives, live Bios attributes, SecureBoot, system
    identity) are accepted **only** from the host interface.

    Tinkerbell / `bmclib` callers should create a session at
    `/redfish/v1/SessionService/Sessions` and re-use the returned token.

  contact:
    name: NanoKVM
    url: https://github.com/pi-bmc/nanokvm-app

servers:
  - url: /
    description: The BMC itself.

tags:
  - name: ServiceRoot
    description: Redfish discovery (public).
  - name: Sessions
    description: Session-based authentication.
  - name: Systems
    description: Managed-server power + boot.
  - name: Bios
    description: Host-reported firmware attributes plus operator-staged pending settings.
  - name: Managers
    description: BMC itself + serial interfaces + virtual media.
  - name: UpdateService
    description: UEFI FMP capsule staging over the USB mass-storage gadget.

security:
  - XAuthToken: []
  - BMCCookie: []

paths:
  # ---------------------------------------------------------------- Discovery

  /redfish:
    get:
      tags: [ServiceRoot]
      summary: Redfish version pointer (DMTF DSP0266 §6.1).
      security: []
      responses:
        "200":
          description: Single-field document pointing at the v1 ServiceRoot.
          content:
            application/json:
              schema:
                type: object
                properties:
                  v1:
                    type: string
                    example: "/redfish/v1/"

  /redfish/v1/:
    get:
      tags: [ServiceRoot]
      summary: ServiceRoot — entry point that links to every collection.
      description:
        The canonical service root, matching gofish's schemas.DefaultServiceRoot.
        This is the trailing-slash spelling DMTF clients request on Login and the
        value emitted as "@odata.id". The bare "/redfish/v1" is also served, for
        clients that predate this.
      security: []
      responses:
        "200":
          description: ServiceRoot document.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceRoot"

  /redfish/v1:
    get:
      tags: [ServiceRoot]
      summary: ServiceRoot without the trailing slash (compatibility alias).
      description:
        Identical to "/redfish/v1/". Retained so existing callers keep working;
        new clients should use the canonical trailing-slash form.
      security: []
      responses:
        "200":
          description: ServiceRoot document.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceRoot"

  # ---------------------------------------------------------------- Sessions

  /redfish/v1/SessionService:
    get:
      tags: [Sessions]
      summary: Session service overview.
      security: []
      responses:
        "200":
          description: SessionService document.
          content:
            application/json:
              schema:
                type: object
                properties:
                  "@odata.id": { type: string }
                  "@odata.type": { type: string }
                  Sessions:
                    type: object
                    properties:
                      "@odata.id": { type: string }

  /redfish/v1/SessionService/Sessions:
    get:
      tags: [Sessions]
      summary: List active sessions.
      responses:
        "200": { $ref: "#/components/responses/Collection" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Sessions]
      summary: Create a new session (login).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [UserName, Password]
              properties:
                UserName: { type: string }
                Password: { type: string }
              example:
                UserName: admin
                Password: admin
      responses:
        "201":
          description: Session created.
          headers:
            X-Auth-Token:
              description: Session token; resend with every subsequent request.
              schema: { type: string }
            Location:
              description: URI of the created Session resource.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401": { $ref: "#/components/responses/Unauthorized" }

  /redfish/v1/SessionService/Sessions/{id}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    delete:
      tags: [Sessions]
      summary: Terminate a session (logout).
      responses:
        "204":
          description: Session deleted.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------- Systems

  /redfish/v1/Systems:
    get:
      tags: [Systems]
      summary: Collection of managed systems (always one).
      responses:
        "200": { $ref: "#/components/responses/Collection" }

  /redfish/v1/Systems/1:
    get:
      tags: [Systems]
      summary: The managed host — power state, boot override, inventory.
      responses:
        "200":
          description: ComputerSystem document.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComputerSystem" }
    patch:
      tags: [Systems]
      summary: |
        Stage a boot override, or (host interface only) report identity.
        The override is staged in BMC state; the host firmware reads and
        applies it itself at its next boot. The host also PATCHes its
        identity (BiosVersion, Manufacturer, Model, SerialNumber, UUID)
        and BootProgress.LastState here — those fields are rejected from
        anywhere but the host interface. The response is always the full
        ComputerSystem, so the host reads the staged override out of it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                Boot:
                  type: object
                  properties:
                    BootSourceOverrideTarget:
                      type: string
                      enum: [None, Pxe, Hdd, Cd, BiosSetup, UefiHttp]
                    BootSourceOverrideEnabled:
                      type: string
                      enum: [Disabled, Once, Continuous]
                BiosVersion: { type: string, description: Host report only. }
                Manufacturer: { type: string, description: Host report only. }
                Model: { type: string, description: Host report only. }
                SerialNumber: { type: string, description: Host report only. }
                UUID: { type: string, description: Host report only. }
                BootProgress:
                  type: object
                  description: Host report only.
                  properties:
                    LastState: { type: string, example: OSRunning }
              example:
                Boot:
                  BootSourceOverrideTarget: Pxe
                  BootSourceOverrideEnabled: Once
      responses:
        "200":
          description: New ComputerSystem state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComputerSystem" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403":
          description: Host-owned fields written from outside the host interface.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RedfishError" }

  /redfish/v1/Systems/1/Actions/ComputerSystem.Reset:
    post:
      tags: [Systems]
      summary: Power control (on / off / cycle / reset / NMI).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ResetType]
              properties:
                ResetType:
                  type: string
                  enum:
                    - "On"
                    - ForceOff
                    - GracefulShutdown
                    - ForceRestart
                    - PowerCycle
              example: { ResetType: ForceRestart }
      responses:
        "200":
          description: Reset accepted.
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/ServerError" }

  # ------------------------------------------------- Host-reported inventory
  #
  # The host firmware owns these resources and writes them over the USB host
  # interface; operators read. Every GET carries an ETag (header and
  # @odata.etag) and honours If-None-Match; writes honour If-Match.

  /redfish/v1/Systems/1/BootOptions:
    get:
      tags: [Systems]
      summary: |
        Boot options — one member per Boot#### variable the host's boot
        manager enumerated. Empty until the host first reports.
      responses:
        "200": { $ref: "#/components/responses/Collection" }
    post:
      tags: [Systems]
      summary: |
        (Host interface only) Report one boot option. Keyed by the body's
        BootOptionReference (falling back to Id, else a generated id); the
        raw body is stored and served back.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                BootOptionReference: { type: string, example: Boot0001 }
                DisplayName: { type: string, example: "UEFI PXEv4" }
                BootOptionEnabled: { type: boolean }
      responses:
        "201": { description: Stored; Location names the member. }
        "403": { description: Not the host interface. }

  /redfish/v1/Systems/1/BootOptions/{option}:
    get:
      tags: [Systems]
      summary: One reported boot option, exactly as the host sent it.
      parameters:
        - { name: option, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: BootOption resource. }
        "404": { description: No such boot option. }
    patch:
      tags: [Systems]
      summary: (Host interface only) Merge changes into a reported boot option.
      parameters:
        - { name: option, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Updated BootOption resource. }
        "403": { description: Not the host interface. }
        "404": { description: No such boot option. }
        "412": { description: If-Match did not match. }
    delete:
      tags: [Systems]
      summary: (Host interface only) Remove a boot option the host retired.
      parameters:
        - { name: option, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Removed. }
        "403": { description: Not the host interface. }
        "404": { description: No such boot option. }

  /redfish/v1/Systems/1/SecureBoot:
    get:
      tags: [Systems]
      summary: UEFI secure-boot state, as last reported by the host firmware.
      responses:
        "200": { description: SecureBoot resource. }
    patch:
      tags: [Systems]
      summary: (Host interface only) Report secure-boot state transitions.
      responses:
        "200": { description: Updated SecureBoot resource. }
        "403": { description: Not the host interface. }
        "412": { description: If-Match did not match. }

  /redfish/v1/Systems/1/Memory:
    get:
      tags: [Systems]
      summary: |
        Memory module collection — one member per module the host firmware
        reported (empty until the host first boots).
      responses:
        "200": { $ref: "#/components/responses/Collection" }
    post:
      tags: [Systems]
      summary: |
        (Host interface only) Report one memory module. Keyed by the body's
        Id (else a generated DIMMn); the raw body is stored and served back.
      responses:
        "201": { description: Stored; Location names the member. }
        "403": { description: Not the host interface. }
  /redfish/v1/Systems/1/Memory/{module}:
    get:
      tags: [Systems]
      summary: One reported memory module, exactly as the host sent it.
      parameters:
        - { name: module, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Memory resource. }
        "404": { description: No such module. }
    patch:
      tags: [Systems]
      summary: (Host interface only) Merge changes into a reported module.
      parameters:
        - { name: module, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Updated Memory resource. }
        "403": { description: Not the host interface. }
        "404": { description: No such module. }
        "412": { description: If-Match did not match. }
  /redfish/v1/Systems/1/Processors:
    get:
      tags: [Systems]
      summary: |
        Processor collection. Lists what the host reported over the host
        interface; until it reports anything, the BMC's own placeholder for
        the board's aarch64 part (CPU1). The first host report replaces that
        placeholder.
      responses:
        "200": { description: ProcessorCollection resource. }
    post:
      tags: [Systems]
      summary: |
        (Host interface only) Report one processor. Keyed by the body's Id
        (else a generated CPUn); the raw body is stored and served back.
      responses:
        "201": { description: Stored; Location names the member. }
        "403": { description: Not the host interface. }
  /redfish/v1/Systems/1/Processors/{processor}:
    get:
      tags: [Systems]
      summary: |
        One processor: what the host reported for this id, or the BMC's
        placeholder for CPU1 while the host has reported none.
      parameters:
        - {
            name: processor,
            in: path,
            required: true,
            schema: { type: string },
          }
      responses:
        "200": { description: Processor resource. }
        "404": { description: No such processor. }
    patch:
      tags: [Systems]
      summary: |
        Merge changes into a processor member. The host updates its
        report here; an operator caps the CPU by PATCHing the standard
        SpeedLimitMHz (0 = no cap) and SpeedLocked properties, which the
        host firmware consumes and applies via config.txt on its next
        boot. Identity keys are not writable.
      parameters:
        - {
            name: processor,
            in: path,
            required: true,
            schema: { type: string },
          }
      responses:
        "200": { description: Updated Processor resource. }
        "400": { description: No writable properties in the request. }
        "404": { description: No such processor. }
        "412": { description: If-Match did not match. }
    delete:
      tags: [Systems]
      summary: (Host interface only) Drop a reported processor.
      parameters:
        - {
            name: processor,
            in: path,
            required: true,
            schema: { type: string },
          }
      responses:
        "204": { description: Removed. }
        "403": { description: Not the host interface. }
        "404": { description: No such processor. }
  /redfish/v1/Systems/1/EthernetInterfaces:
    get:
      tags: [Systems]
      summary: |
        Host NIC collection — one member per physical NIC, POSTed by the
        host firmware each boot (the BMC's own USB gadget link is
        excluded). Empty until the first report lands.
      responses:
        "200": { $ref: "#/components/responses/Collection" }
    post:
      tags: [Systems]
      summary: |
        (Host interface only) Report one NIC; keyed upsert on a
        MAC-derived Id. A report carrying DHCPv4, IPv4StaticAddresses or
        StaticNameServers also refreshes the live EthIp4* Bios attributes.
      responses:
        "201": { description: Stored. }
        "403": { description: Not the host interface. }
  /redfish/v1/Systems/1/EthernetInterfaces/{nic}:
    get:
      tags: [Systems]
      summary: |
        One reported NIC. On the NIC the host firmware manages, the
        EthIp4* Bios attributes render as DHCPv4.DHCPEnabled,
        IPv4StaticAddresses and StaticNameServers.
      parameters:
        - { name: nic, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: The NIC. }
        "404": { description: No such NIC. }
    patch:
      tags: [Systems]
      summary: |
        Stage IPv4 configuration for the host's next boot.
        DHCPv4.DHCPEnabled, IPv4StaticAddresses (one entry) and
        StaticNameServers (up to two) map onto the EthIp4* Bios
        attributes and land in Bios/Settings, which the host firmware
        applies and clears on its next boot.
      parameters:
        - { name: nic, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Staged; response carries an apply-time message. }
        "400": { description: No mapped properties, or an invalid address. }
        "404": { description: No such NIC. }
        "409":
          {
            description:
              Several NICs reported — the managed one is ambiguous; PATCH
              Bios/Settings with EthIp4* attributes instead.
          }
        "412": { description: If-Match failed. }
  /redfish/v1/Systems/1/Storage:
    get:
      tags: [Systems]
      summary: |
        Storage collection: subsystem "1" (the host's own storage, drives
        the host firmware reported) and "BMC" (the USB mass-storage
        gadget's LUNs the BMC presents to it).
      responses:
        "200": { $ref: "#/components/responses/Collection" }
  /redfish/v1/Systems/1/Storage/{storage}:
    get:
      tags: [Systems]
      summary: |
        One subsystem. "1": a Drive per device the host reported, readable
        even while the host is off. "BMC": a Drive per backed gadget LUN
        (the FMP capsule volume, plus the virtual-media ISO while inserted).
      parameters:
        - { name: storage, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Storage resource. }
        "404": { description: No such subsystem. }
  /redfish/v1/Systems/1/Storage/{storage}/Drives:
    post:
      tags: [Systems]
      summary: |
        (Host interface only; storage "1") Report one drive. Keyed by the
        body's Id (else a generated id); the raw body is stored and served
        back.
      parameters:
        - { name: storage, in: path, required: true, schema: { type: string } }
      responses:
        "201": { description: Stored; Location names the member. }
        "403": { description: Not the host interface. }
        "404": { description: No such subsystem. }
  /redfish/v1/Systems/1/Storage/{storage}/Drives/{drive}:
    get:
      tags: [Systems]
      summary: One drive of either subsystem.
      parameters:
        - { name: storage, in: path, required: true, schema: { type: string } }
        - { name: drive, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Drive resource. }
        "404": { description: No such drive. }
    patch:
      tags: [Systems]
      summary: (Host interface only; storage "1") Merge changes into a reported drive.
      parameters:
        - { name: storage, in: path, required: true, schema: { type: string } }
        - { name: drive, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Updated Drive resource. }
        "403": { description: Not the host interface. }
        "404": { description: No such drive. }
        "412": { description: If-Match did not match. }
  /redfish/v1/Chassis:
    get:
      tags: [Chassis]
      summary: Chassis collection (the host baseboard).
      responses:
        "200": { description: ChassisCollection resource. }
  /redfish/v1/Chassis/1:
    get:
      tags: [Chassis]
      summary: |
        The host baseboard, linked to the system it carries and the
        manager. Board identity properties are omitted until a host report
        carries them.
      responses:
        "200": { description: Chassis resource. }
  /redfish/v1/Chassis/1/Sensors:
    get:
      tags: [Chassis]
      summary: |
        Sensors this BMC reads itself. Distinct from `Thermal`, which is
        whatever the managed host published: everything here is measured on
        the BMC side, so the collection is read-only. Empty when the board
        has no slave EEPROM configured.
      responses:
        "200": { description: SensorCollection resource. }
  /redfish/v1/Chassis/1/Sensors/{sensorId}:
    get:
      tags: [Chassis]
      parameters:
        - name: sensorId
          in: path
          required: true
          schema: { type: string, example: SoCTemp }
      summary: |
        One BMC-read sensor. `SoCTemp` is the managed host's die
        temperature, which the host's OP-TEE sensor service pushes into
        this BMC's emulated I2C EEPROM from the secure world.

        `Reading` is omitted whenever there is nothing trustworthy to
        report — no record yet, a failed sample, or a sequence number that
        has stopped advancing because the host went quiet. `Status.State`
        says which, and `Oem.NanoKVM` carries the record's own metadata.
      responses:
        "200":
          description: Sensor resource.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sensor" }
        "404": { description: No such sensor. }
  /redfish/v1/Chassis/1/Thermal:
    get:
      tags: [Chassis]
      summary: |
        The thermal report (Temperatures, Fans) the managed host's firmware
        PATCHes during boot — empty-but-valid before the first report, since
        a 404 would end the host driver's walk. A staged fan override
        appears at Oem.PiBmc.FanOverrideLevel; the host polls for it and
        pins the fan while it is an integer.
      responses:
        "200": { description: Thermal resource. }
    patch:
      tags: [Chassis]
      summary: |
        Two write directions, split by origin. From the host interface:
        the firmware's thermal report (Temperatures and Fans, with the fan
        controller's state under Fans[0].Oem.PiBmc), shallow-merged. From
        an authenticated operator: exactly
        {"Oem":{"PiBmc":{"FanOverrideLevel": n}}} stages the fan override
        the host applies (integer 0..255), null releases it; any other
        operator write is refused because the rest of the resource is a
        host report.
      responses:
        "200": { description: Thermal resource after the write. }
        "400": { description: FanOverrideLevel not an integer 0..255 or null. }
        "403": { description: Operator write outside Oem.PiBmc.FanOverrideLevel. }
        "412": { description: If-Match did not match. }

  /redfish/v1/Systems/1/Bios:
    get:
      tags: [Bios]
      summary: |
        Firmware attributes as last reported by the managed host.
        `@Redfish.Settings` points at the SettingsObject used to stage
        changes for the host's next boot.
      responses:
        "200":
          description: Bios resource.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Bios" }
    post:
      tags: [Bios]
      summary: |
        (Host interface only) Full provision of the live attribute set. The
        v1_1_0 EDK2 client POSTs the complete set when it finds none of its
        attributes on the resource (first boot, or a host reset to
        defaults). The submitted Attributes replace the stored set; the
        Location header names this resource, which the client records as
        the attributes' canonical URI.
      responses:
        "201":
          description: Bios resource, with a Location header.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Bios" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: Not the host interface. }
    put:
      tags: [Bios]
      summary: |
        (Host interface only) Write the live attribute set back. The v1_1_0
        EDK2 client PUTs current values — its PATCH is reserved for the
        pending-settings staging area per the Bios schema. The submitted
        Attributes replace the stored set; the client builds the body on
        top of the resource it just read, so the complete set arrives every
        time.
      responses:
        "200":
          description: Bios resource.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Bios" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: Not the host interface. }
        "412": { description: If-Match did not match. }
    patch:
      tags: [Bios]
      summary: |
        (Host interface only) v1_0_9-era report of the live attribute set.
        Merge, not replace: the submitted keys update the stored set, an
        explicit null retires one, and omitted keys keep their value.
      responses:
        "200":
          description: Bios resource.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Bios" }
        "403": { description: Not the host interface. }
        "412": { description: If-Match did not match. }

  /redfish/v1/Systems/1/Bios/Settings:
    get:
      tags: [Bios]
      summary: Attributes staged for the host firmware's next boot.
      responses:
        "200":
          description: Pending Bios resource (empty Attributes when nothing is staged).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Bios" }
    patch:
      tags: [Bios]
      summary: |
        Stage attributes for the host's next boot (operator auth). The
        submitted Attributes replace the staged set; the host firmware
        reads them over the host interface, applies them at boot, and
        clears the stage by PATCHing an empty set.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [Attributes]
              properties:
                Attributes:
                  type: object
                  additionalProperties: true
              example:
                Attributes:
                  BootTimeout: 5
      responses:
        "200":
          description: Pending Bios resource reflecting what was staged.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Bios" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "412": { description: If-Match did not match. }
    delete:
      tags: [Bios]
      summary: |
        (Host interface only) Acknowledge the staged attributes were
        consumed — the v1_1_0 EDK2 client DELETEs the settings object after
        applying it at boot (the v1_0_9 client cleared it by PATCHing an
        empty set, which still works). Only the stage empties; the resource
        itself keeps answering GET, which the next boot expects.
      responses:
        "204": { description: Stage cleared. }
        "403": { description: Not the host interface. }
        "412": { description: If-Match did not match. }

  /redfish/v1/Systems/1/Bios/{registry}:
    parameters:
      - name: registry
        in: path
        required: true
        description: |
          The registry name the client derived from the Bios resource's
          AttributeRegistry property. EDK2 builds this URI as
          <parent of Bios>/<AttributeRegistry>, so the canonical value is
          BiosAttributeRegistry; versioned variants
          (BiosAttributeRegistry.v1_0_0) and the legacy AttributeRegistry
          spelling resolve to the same document.
        schema: { type: string, default: BiosAttributeRegistry }
    get:
      tags: [Bios]
      summary: |
        The attribute registry — the schema of the Bios Attributes map.
        Before anything is published this serves a base skeleton rather
        than a 404: EDK2's BiosAttributeRegistryDxe GETs the resource
        before deciding to publish, and a 404 ends its walk instead of
        triggering provisioning.
      responses:
        "200": { description: AttributeRegistry document. }
        "404": { description: Not a name the registry resolves under. }
    put:
      tags: [Bios]
      summary: |
        Publish the attribute registry. PUT, not PATCH — the registry is a
        single document replaced wholesale when the firmware's attribute
        vocabulary changes. Accepted both from the host interface
        (unauthenticated, per DSP0270) and from an authenticated operator
        over the LAN; unlike the host's hardware reports the registry is a
        vocabulary document, not a claim of fact about the machine. The
        stored document is flushed to disk before the response returns.
      responses:
        "200": { description: Stored registry document. }
        "404": { description: Not a name the registry resolves under. }
        "412": { description: If-Match did not match. }

  # --------------------------------------------------------------- Managers

  /redfish/v1/Managers:
    get:
      tags: [Managers]
      summary: Collection of managers (always one — the BMC itself).
      responses:
        "200": { $ref: "#/components/responses/Collection" }

  /redfish/v1/Managers/1:
    get:
      tags: [Managers]
      summary: The NanoKVM BMC.
      responses:
        "200":
          description: Manager document.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Manager" }

  /redfish/v1/Managers/1/SerialInterfaces:
    get:
      tags: [Managers]
      summary: Serial interfaces exposed by the BMC.
      responses:
        "200": { $ref: "#/components/responses/Collection" }

  /redfish/v1/Managers/1/SerialInterfaces/1:
    get:
      tags: [Managers]
      summary: The single serial interface bridged to the host.
      responses:
        "200":
          description: SerialInterface document.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SerialInterface" }
    patch:
      tags: [Managers]
      summary: Adjust baud / parity / data-bits / stop-bits on the serial bridge.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SerialInterfacePatch" }
      responses:
        "200":
          description: New SerialInterface state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SerialInterface" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /redfish/v1/Managers/1/VirtualMedia:
    get:
      tags: [Managers]
      summary: Virtual media collection (one CD/USB slot).
      responses:
        "200": { $ref: "#/components/responses/Collection" }

  /redfish/v1/Managers/1/VirtualMedia/CD:
    get:
      tags: [Managers]
      summary: Current virtual-media state.
      responses:
        "200":
          description: VirtualMedia document.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VirtualMedia" }

  /redfish/v1/Managers/1/VirtualMedia/CD/Actions/VirtualMedia.InsertMedia:
    post:
      tags: [Managers]
      summary: Insert an ISO image as a USB CD/disk to the managed host.
      description: |
        Two transfer methods are supported:

        * **Stream** (default) — `application/json` body names an HTTP(S)
          URL; the BMC pulls the image.
        * **Upload** — `multipart/form-data` push from the client. Include
          the binary as a file part named `Image` (or `file`), plus an
          optional `InsertMediaRequestBody` JSON part to override the
          staged filename.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [Image]
              properties:
                Image:
                  type: string
                  description: HTTP(S) URL to the ISO.
                TransferMethod:
                  type: string
                  enum: [Stream]
                  default: Stream
                Inserted: { type: boolean }
                WriteProtected: { type: boolean }
              example:
                {
                  Image: "https://releases.ubuntu.com/22.04/ubuntu-22.04-live-server-arm64.iso",
                }
          multipart/form-data:
            schema:
              type: object
              required: [Image]
              properties:
                Image:
                  type: string
                  format: binary
                  description: The image file body (also accepted as `file`).
                InsertMediaRequestBody:
                  type: string
                  description: |
                    Optional JSON metadata part. Same shape as the
                    `application/json` body; useful to override the staged
                    filename via `Image`.
                  example: '{"TransferMethod":"Upload","Image":"ubuntu.iso"}'
      responses:
        "200": { description: Media inserted. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/ServerError" }

  /redfish/v1/Managers/1/VirtualMedia/CD/Actions/VirtualMedia.EjectMedia:
    post:
      tags: [Managers]
      summary: Eject the currently-inserted virtual media.
      responses:
        "204": { description: Media ejected. }

  # ----------------------------------------------------------- UpdateService

  /redfish/v1/UpdateService:
    get:
      tags: [UpdateService]
      summary: Firmware update service root.
      responses:
        "200":
          description: UpdateService document.
          content:
            application/json:
              schema:
                type: object
                properties:
                  "@odata.type":
                    {
                      type: string,
                      example: "#UpdateService.v1_11_0.UpdateService",
                    }
                  "@odata.id":
                    { type: string, example: "/redfish/v1/UpdateService" }
                  ServiceEnabled: { type: boolean }
                  FirmwareInventory:
                    type: object
                    properties:
                      "@odata.id": { type: string }

  /redfish/v1/UpdateService/FirmwareInventory:
    get:
      tags: [UpdateService]
      summary: Firmware inventory collection.
      responses:
        "200": { $ref: "#/components/responses/Collection" }

  /redfish/v1/UpdateService/FirmwareInventory/{memberId}:
    parameters:
      - name: memberId
        in: path
        required: true
        description: |
          BiosFirmware is the member the host's sync driver PATCHes each
          boot; BIOS is the legacy spelling of the synthesized fallback.
        schema: { type: string, default: BiosFirmware }
    get:
      tags: [UpdateService]
      summary: |
        One firmware inventory entry: the SoftwareInventory document the
        host PATCHed, or — before the first report, for BiosFirmware/BIOS —
        a minimal entry built from the BiosVersion the host reported on
        Systems/1 ("Unknown" before that).
      responses:
        "200":
          description: SoftwareInventory document.
          content:
            application/json:
              schema:
                type: object
                properties:
                  "@odata.type":
                    {
                      type: string,
                      example: "#SoftwareInventory.v1_2_3.SoftwareInventory",
                    }
                  "@odata.id": { type: string }
                  Id: { type: string, example: BiosFirmware }
                  Name: { type: string }
                  Version: { type: string, example: "202608" }
                  SoftwareId:
                    {
                      type: string,
                      description: ESRT firmware class GUID — what a capsule is built against.,
                    }
                  Updateable: { type: boolean }
                  Oem:
                    {
                      type: object,
                      description: PiBmc carries the ESRT integers (FirmwareVersion, LowestSupportedVersion, LastAttemptVersion/Status).,
                    }
        "404": { description: Unknown member. }
    patch:
      tags: [UpdateService]
      summary: |
        (Host interface only) The host's firmware-inventory report. The
        sync driver PATCHes the full SoftwareInventory document once per
        boot; re-reports update the member rather than accumulating
        duplicates, and the first report creates it.
      responses:
        "200": { description: Stored SoftwareInventory document. }
        "403": { description: Not the host interface. }
        "412": { description: If-Match did not match. }

  /redfish/v1/UpdateService/Actions/UpdateService.SimpleUpdate:
    post:
      tags: [UpdateService]
      summary: |
        Download the UEFI FMP capsule at ImageURI and stage it into
        \EFI\UpdateCapsule\ on the capsule volume the BMC presents over USB
        mass storage. The BMC flashes nothing — the host's own firmware finds
        and applies the capsule at its next boot (UEFI 2.10 §8.5.5).
        ImageURI is required; there is no implicit "latest".
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ImageURI]
              properties:
                ImageURI:
                  type: string
                  format: uri
                TransferProtocol:
                  type: string
                  enum: [HTTP, HTTPS]
              example:
                ImageURI: https://example.com/releases/host-firmware.cap
                TransferProtocol: HTTPS
      responses:
        "202":
          { description: Staging accepted; the download runs in background. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { description: A capsule is already being staged. }

  /redfish/v1/UpdateService/update:
    post:
      tags: [UpdateService]
      summary: |
        HttpPushUri: upload capsule bytes directly instead of handing the BMC
        a URL to fetch. Accepts a raw body (application/octet-stream, name it
        with ?name=) or a multipart form whose field is "UpdateFile". The
        capsule is staged into \EFI\UpdateCapsule\ and applied by the host's
        firmware at its next boot.
      parameters:
        - name: name
          in: query
          required: false
          schema: { type: string }
          description: |
            Filename to stage a raw body under. Ignored for multipart uploads,
            which use the part's own filename. Defaults to "update.cap".
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
          multipart/form-data:
            schema:
              type: object
              properties:
                UpdateFile: { type: string, format: binary }
      responses:
        "202": { description: Capsule staged for the host's next boot. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { description: A capsule is already being staged. }

components:
  securitySchemes:
    XAuthToken:
      type: apiKey
      in: header
      name: X-Auth-Token
      description: Session token issued by `POST /redfish/v1/SessionService/Sessions`.
    BMCCookie:
      type: apiKey
      in: cookie
      name: nano-kvm-token
      description: JWT cookie issued by the web UI's login flow.

  parameters:
    SessionId:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: Session identifier.

  responses:
    Collection:
      description: A Redfish collection (Members + Members@odata.count).
      content:
        application/json:
          schema:
            type: object
            properties:
              "@odata.type": { type: string }
              "@odata.id": { type: string }
              Name: { type: string }
              "Members@odata.count": { type: integer, format: int32 }
              Members:
                type: array
                items:
                  type: object
                  properties:
                    "@odata.id": { type: string }

    Unauthorized:
      description: Missing or invalid `X-Auth-Token` / cookie.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/RedfishError" }

    NotFound:
      description: Resource doesn't exist.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/RedfishError" }

    BadRequest:
      description: Request couldn't be parsed or contained an invalid value.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/RedfishError" }

    ServerError:
      description: BMC-side failure (FS error, hardware control failure, etc.).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/RedfishError" }

  schemas:
    ServiceRoot:
      type: object
      properties:
        "@odata.type":
          { type: string, example: "#ServiceRoot.v1_9_0.ServiceRoot" }
        "@odata.id": { type: string, example: "/redfish/v1/" }
        "@odata.context": { type: string }
        Id: { type: string, example: RootService }
        Name: { type: string, example: "Root Service" }
        Systems: { type: object, properties: { "@odata.id": { type: string } } }
        Managers:
          { type: object, properties: { "@odata.id": { type: string } } }
        Chassis: { type: object, properties: { "@odata.id": { type: string } } }
        SessionService:
          { type: object, properties: { "@odata.id": { type: string } } }
        UpdateService:
          { type: object, properties: { "@odata.id": { type: string } } }

    Session:
      type: object
      properties:
        "@odata.type": { type: string, example: "#Session.v1_5_0.Session" }
        "@odata.id":
          {
            type: string,
            example: "/redfish/v1/SessionService/Sessions/abc123",
          }
        Id: { type: string }
        Name: { type: string }
        UserName: { type: string }

    Sensor:
      type: object
      properties:
        "@odata.type": { type: string, example: "#Sensor.v1_2_0.Sensor" }
        "@odata.id": { type: string, example: "/redfish/v1/Chassis/1/Sensors/SoCTemp" }
        Id: { type: string, example: SoCTemp }
        Name: { type: string, example: Host SoC Temperature }
        ReadingType: { type: string, example: Temperature }
        ReadingUnits: { type: string, example: Cel }
        # Omitted when there is no trustworthy value; absent is not zero.
        Reading: { type: number, format: double, example: 47.25 }
        Status:
          type: object
          properties:
            State: { type: string, enum: [Enabled, UnavailableOffline] }
            Health: { type: string, example: OK }
        Oem:
          type: object
          properties:
            NanoKVM:
              type: object
              properties:
                Sequence:
                  type: integer
                  description: The sensor service's sample counter.
                HostUptimeSeconds:
                  type: integer
                  description: Seconds since the host's secure-world boot at sample time.
                Stale:
                  type: boolean
                  description: The sequence number has stopped advancing.
                TemperatureValid:
                  type: boolean
                  description: The underlying die-temperature read succeeded.
                LastPushOK:
                  type: boolean
                  description: The host's previous EEPROM write succeeded.
    ComputerSystem:
      type: object
      properties:
        "@odata.type":
          { type: string, example: "#ComputerSystem.v1_5_0.ComputerSystem" }
        "@odata.id": { type: string, example: "/redfish/v1/Systems/1" }
        "@odata.etag": { type: string }
        Id: { type: string, example: "1" }
        Name: { type: string }
        SystemType: { type: string, example: Physical }
        PowerState: { type: string, enum: ["On", "Off"] }
        # Identity is whatever the host last reported over the host
        # interface. Every property is omitted rather than emitted empty.
        Model: { type: string }
        Manufacturer: { type: string }
        SerialNumber: { type: string }
        UUID: { type: string }
        BiosVersion: { type: string }
        BootProgress:
          type: object
          description: Host-reported boot phase.
          properties:
            LastState: { type: string, example: OSRunning }
            LastStateTime: { type: string, format: date-time }
        Boot:
          type: object
          description: |
            The staged boot override. BMC state the host firmware reads
            over the host interface and applies itself at its next boot;
            BootOptions links the host-reported Boot#### collection.
          properties:
            BootSourceOverrideTarget:
              { type: string, enum: [None, Pxe, Hdd, Cd, BiosSetup, UefiHttp] }
            BootSourceOverrideEnabled:
              { type: string, enum: [Disabled, Once, Continuous] }
            "BootSourceOverrideTarget@Redfish.AllowableValues":
              type: array
              items: { type: string }
            "BootSourceOverrideEnabled@Redfish.AllowableValues":
              type: array
              items: { type: string }
            BootOptions:
              type: object
              properties: { "@odata.id": { type: string } }
        Actions:
          type: object
          properties:
            "#ComputerSystem.Reset":
              type: object
              properties:
                target: { type: string }
                "ResetType@Redfish.AllowableValues":
                  type: array
                  items: { type: string }
        Bios:
          type: object
          properties:
            "@odata.id": { type: string, example: "/redfish/v1/Systems/1/Bios" }
        SecureBoot:
          type: object
          properties:
            "@odata.id":
              { type: string, example: "/redfish/v1/Systems/1/SecureBoot" }
        Links:
          type: object
          properties:
            Chassis:
              type: array
              items:
                { type: object, properties: { "@odata.id": { type: string } } }

    SoftwareInventory:
      type: object
      properties:
        "@odata.type":
          {
            type: string,
            example: "#SoftwareInventory.v1_8_0.SoftwareInventory",
          }
        "@odata.id":
          {
            type: string,
            example: "/redfish/v1/UpdateService/FirmwareInventory/BIOS",
          }
        Id: { type: string, example: BIOS }
        Name: { type: string }
        Description: { type: string }
        SoftwareId: { type: string, example: BIOS }
        Version:
          { type: string, description: Host-reported boot firmware version. }
        Updateable: { type: boolean }
        Status:
          type: object
          properties:
            State: { type: string }
            Health: { type: string }

    Bios:
      type: object
      properties:
        "@odata.type": { type: string, example: "#Bios.v1_0_9.Bios" }
        "@odata.id": { type: string, example: "/redfish/v1/Systems/1/Bios" }
        "@odata.etag": { type: string }
        Id: { type: string, example: Bios }
        Name: { type: string }
        Description: { type: string }
        BiosVersion:
          { type: string, description: Host-reported firmware version. }
        AttributeRegistry:
          {
            type: string,
            description: Present once the host has published a registry.,
          }
        Attributes:
          type: object
          description: |
            Flat key→value map. The host firmware owns the vocabulary and
            publishes its schema at /Systems/1/Bios/AttributeRegistry;
            the BMC stores and serves the values verbatim.
          additionalProperties: true
        "@Redfish.Settings":
          type: object
          properties:
            "@odata.type": { type: string }
            SettingsObject:
              type: object
              properties:
                "@odata.id": { type: string }
            SupportedApplyTimes:
              type: array
              items: { type: string, example: OnReset }

    Manager:
      type: object
      properties:
        "@odata.type": { type: string, example: "#Manager.v1_15_0.Manager" }
        "@odata.id": { type: string, example: "/redfish/v1/Managers/1" }
        Id: { type: string, example: "1" }
        Name: { type: string, example: "NanoKVM BMC" }
        ManagerType: { type: string, example: BMC }
        FirmwareVersion: { type: string }
        Status:
          type: object
          properties:
            State: { type: string, example: Enabled }
            Health: { type: string, example: OK }

    SerialInterface:
      type: object
      properties:
        "@odata.type":
          { type: string, example: "#SerialInterface.v1_2_0.SerialInterface" }
        "@odata.id": { type: string }
        Id: { type: string, example: "1" }
        Name: { type: string }
        InterfaceEnabled: { type: boolean }
        SignalType: { type: string, example: Rs232 }
        BitRate: { type: string, example: "115200" }
        Parity: { type: string, example: None }
        DataBits: { type: string, example: "8" }
        StopBits: { type: string, example: "1" }
        FlowControl: { type: string, example: None }

    SerialInterfacePatch:
      type: object
      properties:
        InterfaceEnabled: { type: boolean }
        BitRate: { type: string }
        Parity: { type: string }
        DataBits: { type: string }
        StopBits: { type: string }
        FlowControl: { type: string }

    VirtualMedia:
      type: object
      properties:
        "@odata.type":
          { type: string, example: "#VirtualMedia.v1_5_0.VirtualMedia" }
        "@odata.id": { type: string }
        Id: { type: string, example: "1" }
        Name: { type: string }
        MediaTypes:
          type: array
          items: { type: string, example: CD }
        Image:
          {
            type: [string, "null"],
            example: ubuntu-22.04-live-server-arm64.iso,
          }
        Inserted: { type: boolean }
        WriteProtected: { type: boolean }
        ConnectedVia: { type: string, example: Applet }
        Actions:
          type: object

    RedfishError:
      type: object
      description: |
        Standard Redfish error envelope (DSP0266 §6.5.6). The `code` field
        is a DMTF-defined Message ID; `message` is the human-readable text.
      properties:
        error:
          type: object
          properties:
            code: { type: string, example: "Base.1.13.GeneralError" }
            message: { type: string }
            "@Message.ExtendedInfo":
              type: array
              items:
                type: object
                properties:
                  MessageId: { type: string }
                  Message: { type: string }
                  Severity: { type: string, enum: [OK, Warning, Critical] }
