version: 2

before:
  hooks:
    - go mod tidy
    - bash -c "echo '{{ .Version }}' > version"

builds:
  - id: server
    env: ["CGO_ENABLED=0"]
    main: ./cmd/server
    binary: server/NanoKVM-Server
    flags:
      - -trimpath # reproducible builds; strips build-tree paths from the binary
    ldflags:
      - -s # strip symbol table (~20% size reduction)
      - -w # strip DWARF debug info (~25% size reduction)
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
    goos:
      - linux
    goarch:
      - riscv64
  - id: rpiboot
    env: ["CGO_ENABLED=0"]
    main: ./cmd/rpiboot
    binary: system/usr/bin/rpiboot
    flags:
      - -trimpath
    ldflags:
      - -s
      - -w
    goos:
      - linux
    goarch:
      - riscv64
    # BOARD_TOOLS packaging axis (Makefile header comment): this RPi-only
    # companion binary is skipped when BOARD_TOOLS is set empty (e.g. a
    # NUC/non-RPi deploy). The archive below still references this build's
    # id unconditionally — goreleaser just omits it from the tarball when
    # skipped, so no archive change is needed. BOARD_TOOLS must be present
    # in the environment (empty is a valid value, missing is not): `make
    # snapshot` passes it through; CI workflows default it in their own env
    # blocks so a plain `goreleaser release`/`build` keeps today's behavior.
    skip: '{{ eq .Env.BOARD_TOOLS "" }}'

upx:
  - enabled: true
    compress: best
    lzma: true

archives:
  - id: nanokvm
    ids:
      - server
      - rpiboot
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}"
    files:
      - LICENSE
      - README.md
      - version

checksum:
  name_template: "checksums.txt"

release:
  draft: false
  prerelease: auto
  name_template: "{{ .Tag }}"
  make_latest: true

snapshot:
  version_template: "{{ .Version }}-next"

changelog:
  disable: "{{ .IsSnapshot }}"
